# Subdomain Takeover Fingerprint Database
# Source: EdOverflow/can-i-take-over-xyz + HackerOne disclosures + community research
# Last Updated: 2025
#
# Fields:
#   service: Name of the service
#   cname_patterns: CNAME patterns that indicate this service
#   fingerprints: HTTP response strings indicating unclaimed resource
#   status: vulnerable | not_vulnerable | edge_case | requires_verification
#   http_status: Expected HTTP status code(s) when vulnerable
#   documentation: Reference links
#   notes: Additional context
#   can_claim: Whether an attacker can actually claim the resource

services:

  # ============================================
  # AWS SERVICES
  # ============================================
  
  - service: "AWS S3"
    cname_patterns:
      - "*.s3.amazonaws.com"
      - "*.s3-website-*.amazonaws.com"
      - "*.s3.*.amazonaws.com"
      - "s3-website.*.amazonaws.com"
    fingerprints:
      - "NoSuchBucket"
      - "The specified bucket does not exist"
      - "<Code>NoSuchBucket</Code>"
    status: "vulnerable"
    http_status: [404]
    can_claim: true
    documentation:
      - "https://github.com/EdOverflow/can-i-take-over-xyz/issues/36"
      - "https://hackerone.com/reports/1715538"
      - "https://hackerone.com/reports/121461"
    notes: |
      Classic takeover. Create bucket with exact name in correct region.
      Bucket names are globally unique in AWS.
      CRITICAL: Determine the correct AWS region before attempting claim.
      Region can often be extracted from the CNAME itself.

  - service: "AWS CloudFront"
    cname_patterns:
      - "*.cloudfront.net"
    fingerprints:
      - "Bad Request"
      - "ERROR The request could not be satisfied"
      - "The distribution is not configured for the requested origin"
      - "CloudFront wasn't able to connect to the origin"
    status: "edge_case"
    http_status: [403, 400]
    can_claim: true
    documentation:
      - "https://github.com/EdOverflow/can-i-take-over-xyz/issues/29"
    notes: |
      Edge case. AWS has added protections.
      Takeover requires creating a new CloudFront distribution with the target
      subdomain as an Alternate Domain Name (CNAME).
      May not always work due to AWS domain verification requirements added in 2024+.
      Verify the distribution ID is truly orphaned.

  - service: "AWS Elastic Beanstalk"
    cname_patterns:
      - "*.elasticbeanstalk.com"
    fingerprints:
      - "NXDOMAIN"
    status: "vulnerable"
    http_status: [0]
    can_claim: true
    documentation:
      - "https://github.com/EdOverflow/can-i-take-over-xyz/issues/194"
    notes: |
      If the Elastic Beanstalk environment is deleted but CNAME remains,
      the environment name can be reclaimed in the same AWS region.

  - service: "AWS Global Accelerator"
    cname_patterns:
      - "*.awsglobalaccelerator.com"
    fingerprints:
      - "NXDOMAIN"
    status: "edge_case"
    http_status: [0]
    can_claim: false
    notes: "Requires specific conditions. Rarely exploitable."

