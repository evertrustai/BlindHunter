  # ============================================
  # GITHUB
  # ============================================

  - service: "GitHub Pages"
    cname_patterns:
      - "*.github.io"
      - "*.githubusercontent.com"
    fingerprints:
      - "There isn't a GitHub Pages site here."
      - "For root URLs (like http://example.com/) you must provide an index.html file"
    status: "vulnerable"
    http_status: [404]
    can_claim: true
    documentation:
      - "https://github.com/EdOverflow/can-i-take-over-xyz/issues/37"
      - "https://hackerone.com/reports/263902"
      - "https://hackerone.com/reports/325336"
    notes: |
      Two scenarios:
      1. User/org <user>.github.io doesn't exist → register username and create repo
      2. User exists but <user>.github.io repo is deleted → create the repo
      GitHub Pages requires CNAME file in repo matching the custom domain.
      GitHub has added domain verification for organizations (check if org has it).

