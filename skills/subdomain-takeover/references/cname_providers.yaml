    fingerprint: "No such app"

  pantheon:
    patterns:
      - "*.pantheonsite.io"
      - "*.pantheon.io"
    service_type: "CMS Hosting"
    takeover_possible: true
    fingerprint: "404 error unknown site"

  netlify:
    patterns:
      - "*.netlify.app"
      - "*.netlify.com"
      - "*.bitballoon.com"
    service_type: "Static Hosting"
    takeover_possible: false
    notes: "Domain verification required"

  vercel:
    patterns:
      - "*.vercel.app"
      - "*.now.sh"
    service_type: "Serverless Hosting"
    takeover_possible: false
    notes: "Domain verification required"

  surge:
    patterns:
      - "*.surge.sh"
    service_type: "Static Hosting"
    takeover_possible: true
    fingerprint: "project not found"

  fly_io:
    patterns:
      - "*.fly.dev"
    service_type: "Container Hosting"
    takeover_possible: true

  render:
    patterns:
      - "*.onrender.com"
    service_type: "PaaS"
    takeover_possible: "edge_case"

  cloudflare_pages:
    patterns:
      - "*.pages.dev"
      - "*.workers.dev"
    service_type: "Edge Hosting"
    takeover_possible: false

