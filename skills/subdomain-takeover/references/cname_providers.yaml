# CNAME to Cloud Provider Mapping Database
# Quick-reference for mapping CNAME targets to their cloud provider and service type
# Used by Recon-Agent for rapid classification

# ============================================
# AWS (Amazon Web Services)
# ============================================
aws:
  s3:
    patterns:
      - "*.s3.amazonaws.com"
      - "*.s3-website-*.amazonaws.com"
      - "*.s3.*.amazonaws.com"
      - "s3-website.*.amazonaws.com"
    service_type: "Object Storage"
    takeover_possible: true
    fingerprint: "NoSuchBucket"

  cloudfront:
    patterns:
      - "*.cloudfront.net"
    service_type: "CDN"
    takeover_possible: "edge_case"
    fingerprint: "Bad Request | ERROR"

  elastic_beanstalk:
    patterns:
      - "*.elasticbeanstalk.com"
    service_type: "PaaS"
    takeover_possible: true
    fingerprint: "NXDOMAIN"

  elb:
    patterns:
      - "*.elb.amazonaws.com"
      - "*.elb.*.amazonaws.com"
    service_type: "Load Balancer"
    takeover_possible: false
    notes: "ELB endpoints are tied to AWS accounts, not claimable"

  global_accelerator:
    patterns:
      - "*.awsglobalaccelerator.com"
    service_type: "Network Accelerator"
    takeover_possible: false

# ============================================
# MICROSOFT AZURE
# ============================================
azure:
  app_service:
    patterns:
      - "*.azurewebsites.net"
      - "*.scm.azurewebsites.net"
    service_type: "PaaS"
    takeover_possible: true
    fingerprint: "404 Web Site not found"

  traffic_manager:
    patterns:
      - "*.trafficmanager.net"
    service_type: "DNS Load Balancer"
    takeover_possible: true
    fingerprint: "NXDOMAIN"

  cdn:
    patterns:
      - "*.azureedge.net"
    service_type: "CDN"
    takeover_possible: true
    fingerprint: "404 - Not Found"

  blob_storage:
    patterns:
      - "*.blob.core.windows.net"
    service_type: "Object Storage"
    takeover_possible: "edge_case"
    fingerprint: "BlobNotFound | ResourceNotFound"

  front_door:
    patterns:
      - "*.azurefd.net"
    service_type: "CDN/WAF"
    takeover_possible: "edge_case"

  cloud_app:
    patterns:
      - "*.cloudapp.azure.com"
    service_type: "Cloud Service"
    takeover_possible: "edge_case"
    fingerprint: "NXDOMAIN"

  api_management:
    patterns:
      - "*.azure-api.net"
    service_type: "API Gateway"
    takeover_possible: "edge_case"

# ============================================
# GOOGLE CLOUD
# ============================================
gcp:
  storage:
    patterns:
      - "*.storage.googleapis.com"
      - "c.storage.googleapis.com"
    service_type: "Object Storage"
    takeover_possible: "edge_case"
    fingerprint: "NoSuchBucket"

  app_engine:
    patterns:
      - "*.appspot.com"
    service_type: "PaaS"
    takeover_possible: false
    notes: "Requires domain verification"

  firebase:
    patterns:
      - "*.firebaseapp.com"
      - "*.web.app"
    service_type: "Hosting"
    takeover_possible: false
    notes: "Requires domain verification"

# ============================================
# GITHUB
# ============================================
github:
  pages:
    patterns:
      - "*.github.io"
    service_type: "Static Hosting"
    takeover_possible: true
    fingerprint: "There isn't a GitHub Pages site here"

  content:
    patterns:
      - "*.githubusercontent.com"
    service_type: "Content Delivery"
    takeover_possible: false

# ============================================
# HOSTING PLATFORMS
# ============================================
hosting:
